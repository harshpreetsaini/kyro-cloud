# Render deployment = BACKEND ONLY (REST API + WebSocket control plane).
# The Next.js frontend is deployed separately on Vercel.
# Render does NOT build or serve Next.js — it runs the standalone backend.
services:
  - type: web
    name: luna-cloud
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: standard
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects $PORT automatically; the server listens on 0.0.0.0:$PORT.
      - key: FRONTEND_URL
        # The Vercel frontend origin. Must be set to your Vercel URL.
        # CORS on the backend allows only this origin (never "*" with credentials).
        value: https://kyro-cloud.vercel.app
      - key: AUTH_SECRET
        # MUST be set to the SAME value as Vercel's AUTH_SECRET — the backend
        # verifies browser session JWTs signed by the frontend.
        sync: false
      - key: LUNA_USER
        sync: false
      - key: LUNA_PASSWORD
        sync: false
      - key: RUNTIME_AUTH_SECRET
        # Shared with the Colab agent via the LUNA_RUNTIME_AUTH Colab secret.
        generateValue: true
      - key: BACKEND_SERVICE_KEY
        # Shared service key between Vercel and Render — enables durable
        # provider-link persistence + hydration (set identically on both).
        sync: false
      - key: CREDENTIAL_SECRET
        # Encryption-at-rest key for linked provider credentials. Set the same
        # value on Vercel; rotating it invalidates every stored secret.
        sync: false
      - key: COMPUTE_PROVIDER
        value: colab
      - key: STREAMING_PROVIDER
        value: vnc
      - key: HEARTBEAT_TIMEOUT_MS
        value: "20000"
