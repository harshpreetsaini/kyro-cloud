services:
  - type: web
    name: luna-cloud
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects $PORT automatically; the server listens on 0.0.0.0:$PORT.
      - key: NEXT_PUBLIC_APP_NAME
        value: KYRO CLOUD
      - key: FRONTEND_URL
        # Set this to your Vercel frontend URL, e.g. https://kyro-cloud.vercel.app
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: LUNA_USER
        sync: false
      - key: LUNA_PASSWORD
        sync: false
      - key: RUNTIME_AUTH_SECRET
        generateValue: true
      - key: COMPUTE_PROVIDER
        value: colab
      - key: STREAMING_PROVIDER
        value: webrtc
      - key: HEARTBEAT_TIMEOUT_MS
        value: "20000"
